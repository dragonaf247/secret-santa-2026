<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Mùa Noel Bí Ẩn Của 204 🎄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* GIAO DIỆN BÍ ẨN (DARK THEME) */
        body { 
            background-color: #0a0a0a; 
            /* Ảnh nền rừng thông ban đêm tối mờ */
            background-image: url('https://images.unsplash.com/photo-1513628253939-010e64ac66cd?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            position: relative; 
            overflow-x: hidden; 
            color: #e2e8f0;
        }
        
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 5, 10, 0.85); z-index: -1; }
        
        /* Box chứa nội dung tối mờ với viền đỏ phát sáng nhẹ */
        .glass-panel { 
            background: rgba(20, 20, 25, 0.7); 
            backdrop-filter: blur(12px); 
            border-radius: 16px; 
            box-shadow: 0 0 40px rgba(139, 0, 0, 0.3); 
            border: 1px solid rgba(220, 38, 38, 0.2); 
        }
        
        .glass-form { 
            background: rgba(10, 10, 15, 0.8); 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Nút bấm ma mị */
        .btn-mystic { 
            background: linear-gradient(135deg, #7f1d1d, #991b1b); 
            color: #fff; 
            font-weight: bold; 
            padding: 12px 24px; 
            border-radius: 8px; 
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); 
            transition: all 0.3s ease; 
            width: 100%; 
            border: 1px solid #dc2626;
        }
        .btn-mystic:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.8); 
            background: linear-gradient(135deg, #991b1b, #b91c1c); 
        }

        /* Form Input nền tối */
        .form-input { 
            width: 100%; padding: 10px 15px; border: 1px solid #334155; border-radius: 8px; margin-top: 5px; 
            transition: all 0.3s; background-color: #1e293b; color: white;
        }
        .form-input:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2); }
        .form-input::placeholder { color: #64748b; }

        /* Nút Filter */
        .filter-btn { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #334155; color: #cbd5e1; transition: all 0.2s; border: 1px solid #475569; }
        .filter-btn:hover { background: #475569; }
        .filter-btn.active { background: #7f1d1d; color: #fff; border-color: #ef4444; box-shadow: 0 0 10px rgba(220,38,38,0.5); }

        .tab-locked { opacity: 0.4; cursor: not-allowed; position: relative; background: #1e293b !important; color: #64748b !important; border: none; }
        .tab-locked::after { content: "🔒"; position: absolute; top: -10px; right: -10px; font-size: 1.2rem; }
        .tab-active { background: #1a1a1a !important; color: #ef4444 !important; border-bottom: 4px solid #dc2626 !important; }

        /* Tiêu đề phát sáng */
        .glow-text {
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.8), 0 0 20px rgba(220, 38, 38, 0.5);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <!-- TRÌNH PHÁT NHẠC NỔI Ở GÓC DƯỚI -->
    <div class="fixed bottom-6 right-6 z-50">
        <button id="musicToggleBtn" onclick="toggleMusic()" class="bg-black border border-red-500 text-white rounded-full p-4 shadow-[0_0_20px_rgba(220,38,38,0.6)] hover:scale-110 transition flex items-center justify-center animate-bounce">
            🎵 Bật Nhạc
        </button>
        <audio id="bgMusic" loop>
            <!-- Link nhạc Giáng sinh huyền bí không bản quyền -->
            <source src="https://assets.mixkit.co/music/preview/mixkit-christmas-magic-147.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="container mx-auto px-4 py-10 max-w-4xl">
        <div class="text-center mb-10">
            <h1 class="text-5xl md:text-6xl font-extrabold text-red-500 mb-4 glow-text">
                🩸 Noel Bí Ẩn Của 204
            </h1>
            <p class="text-xl text-gray-400 font-medium tracking-wider">Lễ hội đổi quà trong bóng tối đã bắt đầu...</p>
        </div>

        <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-8">
            <button class="bg-white tab-active font-bold py-2 px-4 md:px-6 rounded-t-lg shadow-[0_-5px_15px_rgba(220,38,38,0.2)]">Part 1: Khởi Nguồn</button>
            <button class="bg-gray-200 tab-locked font-semibold py-2 px-4 md:px-6 rounded-t-lg">Part 2: Lời Thì Thầm</button>
            <button class="bg-gray-200 tab-locked font-semibold py-2 px-4 md:px-6 rounded-t-lg">Part 3: Săn Lùng</button>
            <button class="bg-gray-200 tab-locked font-semibold py-2 px-4 md:px-6 rounded-t-lg">Part 4: Lộ Diện</button>
        </div>

        <div class="glass-panel p-6 md:p-10">
            <div id="part1
